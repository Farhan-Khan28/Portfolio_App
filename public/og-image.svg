<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181D"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#08090B"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1E222A" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Content Card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="url(#cardGrad)" stroke="#252A33" stroke-width="2"/>

  <!-- Logo Pill -->
  <rect x="130" y="120" width="48" height="48" rx="12" fill="#08090B" stroke="#252A33" stroke-width="1.5"/>
  <text x="154" y="152" font-family="-apple-system, sans-serif" font-weight="900" font-size="20" fill="#6366F1" text-anchor="middle">FK</text>

  <!-- Eyebrow -->
  <rect x="195" y="126" width="400" height="36" rx="18" fill="#15181D" stroke="#252A33" stroke-width="1"/>
  <circle cx="215" cy="144" r="4" fill="#10B981"/>
  <text x="230" y="149" font-family="monospace" font-size="13" font-weight="700" fill="#818CF8" letter-spacing="1">SENIOR FULL-STACK WEB DEVELOPER</text>

  <!-- Name & Headline -->
  <text x="130" y="240" font-family="-apple-system, sans-serif" font-size="64" font-weight="800" fill="#F5F7FA" letter-spacing="-1.5">Farhan Khan</text>
  <text x="130" y="300" font-family="-apple-system, sans-serif" font-size="28" font-weight="600" fill="#818CF8">I build complete web applications from frontend to backend.</text>
  <text x="130" y="340" font-family="-apple-system, sans-serif" font-size="20" font-weight="400" fill="#A5ABB5">React.js · Node.js Microservices · Laravel MVC · PostgreSQL · MySQL · WebSockets</text>

  <!-- Badges / Projects -->
  <g transform="translate(130, 400)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="70" rx="12" fill="#08090B" stroke="#252A33" stroke-width="1"/>
    <text x="20" y="30" font-family="monospace" font-size="11" fill="#6F7682">FEATURED PLATFORM</text>
    <text x="20" y="52" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#F5F7FA">JIBZ CRM (jibzcrm.in)</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="250" height="70" rx="12" fill="#08090B" stroke="#252A33" stroke-width="1"/>
    <text x="260" y="30" font-family="monospace" font-size="11" fill="#6F7682">REAL-TIME PLATFORM</text>
    <text x="260" y="52" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#F5F7FA">KT Messenger (Microservices)</text>

    <!-- Badge 3 -->
    <rect x="510" y="0" width="230" height="70" rx="12" fill="#08090B" stroke="#252A33" stroke-width="1"/>
    <text x="530" y="30" font-family="monospace" font-size="11" fill="#6F7682">ENGINEERING PROFILE</text>
    <text x="530" y="52" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#10B981">Available for Contracts</text>
  </g>

  <!-- Bottom Brand -->
  <text x="1070" y="525" font-family="monospace" font-size="14" fill="#6F7682" text-anchor="end">farhan-khan28.github.io/Portfolio_App</text>
</svg>
